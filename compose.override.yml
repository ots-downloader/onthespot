# Present only in a clone of the repository. Compose loads this file by
# itself beside compose.yml, so a clone builds the image from source:
#   docker compose up -d --build
# To run the published image from a clone instead:
#   docker compose -f compose.yml up -d
services:
  onthespot:
    image: onthespot:local
    build:
      context: .
      dockerfile: Dockerfile
    pull_policy: build
