[project]
name = "onthespot"
version = "2.0.5"
description = "An easy to use music downloader written in Python."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "bgutil-ytdlp-pot-provider>=2.0.2",
    "cryptography>=50.0.2",
    "defusedxml>=0.7.1",
    "fastapi[standard]>=0.165.0",
    "librespot",
    "m3u8>=6.0.0",
    "music-tag>=0.4.3",
    "mutagen>=1.48.1",
    "pillow>=13.0.0",
    "pywidevine>=1.9.0",
    "requests>=2.34.2",
    "urllib3>=2.8.0",
    "yt-dlp[default]>=2026.10.26",
]

[tool.uv.sources]
librespot = { git = "https://github.com/ots-downloader/librespot-python.git" }
[tool.fastapi]
entrypoint = "src.onthespot.main:app"

[tool.ruff.lint.per-file-ignores]
# Registry imports are intentionally grouped beside the callable maps they
# populate; keeping those sections together makes service additions auditable.
"src/onthespot/api/registry.py" = ["E402"]
