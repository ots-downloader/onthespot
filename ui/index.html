<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OnTheSpot - Music and Media Downloader</title>
    <meta name="description" content="Web interface for OnTheSpot music and media downloader " />
    <meta property="og:title" content="OnTheSpot - Music and Media Downloader" />
    <meta property="og:description" content="Web interface for OnTheSpot music and media downloader" />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="color-scheme" content="light dark" />
    <script>
      // Apply the saved appearance before first paint. Keep the key and the
      // values in step with src/lib/theme.ts.
      try {
        var saved = localStorage.getItem("ots-theme");
        if (saved === "light" || saved === "dark") {
          document.documentElement.setAttribute("data-theme", saved);
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
